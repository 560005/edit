name: Deploy

on:
  push:
    paths:
      - "data/*.csv"
      - ".github/workflows/deploy.yml"
    branches: [ main ]
  workflow_dispatch:

jobs:
  deploy:
    runs-on: ubuntu-latest

    steps:
      - name: Checkout code
        uses: actions/checkout@v4

      - name: Install Babashka + sqlite-utils
        env:
          BABASHKA_VERSION: 1.12.208
        run: |
          curl -sLO https://github.com/babashka/babashka/releases/download/v${{env.BABASHKA_VERSION}}/babashka-${{env.BABASHKA_VERSION}}-linux-amd64.tar.gz
          sudo tar -xzf babashka-${{env.BABASHKA_VERSION}}-linux-amd64.tar.gz -C /usr/local/bin --strip-components=0
          rm -f babashka-${{env.BABASHKA_VERSION}}-linux-amd64.tar.gz
          pip install sqlite-utils

      - name: Build DB from schema + CSV
        run: ./bin/build-db

      - name: Verify DB exists
        run: test -f data.db

      - name: Load data into Cloudflare D1
        env:
          CLOUDFLARE_API_TOKEN: ${{ secrets.CLOUDFLARE_API_TOKEN }}
          CLOUDFLARE_ACCOUNT_ID: ${{ secrets.CLOUDFLARE_ACCOUNT_ID }}
        run: |
          # Rebuild the D1 tables from the freshly-built SQLite DB. DROP first so
          # the load is a full replace; strip PRAGMA/transaction lines that D1's
          # query endpoint wraps itself.
          {
            echo "DROP TABLE IF EXISTS listings;"
            echo "DROP TABLE IF EXISTS categories;"
            sqlite3 data.db .dump | grep -vE '^(PRAGMA|BEGIN TRANSACTION;|COMMIT;)'
          } > load.sql
          npx --yes wrangler@4 d1 execute 560005-town --remote --file=load.sql -y

      - name: Trigger home repo deploy
        uses: peter-evans/repository-dispatch@v3
        with:
          token: ${{ secrets.GHA_DISPATCH_TOKEN }}
          repository: 560005/home
          event-type: deploy
